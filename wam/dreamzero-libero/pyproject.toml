[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamzero-fbfm-libero"
version = "0.1.0"
description = "Training-free joint state-action feedback flow matching for DreamZero on LIBERO"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "omegaconf>=2.3", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
addopts = "-q"
